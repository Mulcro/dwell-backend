name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno task check

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # Pinned: config.toml is written by the local CLI and older versions
      # reject its newer keys.
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - run: supabase start
      - run: supabase db lint --level warning --fail-on warning
      - run: supabase test db
      # Runs the real handlers against the started stack; OpenAI is faked, so no key.
      - run: deno task test:integration
      # Boots the functions over HTTP. The suites above import handlers directly and
      # never execute index.ts, so only this catches a function that cannot start.
      - run: ./scripts/smoke-functions.sh
